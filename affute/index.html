<!doctype html>
<html lang="fr">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="description" content="Plan de sèche ou de prise de masse personnalisé, repas riches en protéines avec les vrais prix chez Leclerc, Lidl, Super U, Carrefour…, base complète des aliments et projection de ton futur corps.">
  <meta name="theme-color" content="#f2f2f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Affûté">
  <link rel="icon" href="icons/logo.svg" type="image/svg+xml">

  <link rel="manifest" href="manifest.webmanifest">

    <span class="spacer"></span>
    <a class="day-chip" id="day-chip" href="#/plan" hidden></a>
    <a class="icon-btn" href="#/profil" aria-label="Mon profil">

      <a href="#/plan" data-tab="plan">

      <a href="#/sport" data-tab="sport">

      </a>
      <a href="#/photos" data-tab="photos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v12H4z"/><circle cx="12" cy="13" r="4"/></svg>Corps

  <script type="module" src="js/app.js"></script>
